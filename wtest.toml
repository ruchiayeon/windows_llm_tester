# wtest 설정 (architecture.md §6: 임계값 · 가중치 · 값 경계 클래스는 설정 파일로 관리)

[db]
path = "data/coverage.db"
busy_timeout_ms = 30000

[catalog]
path = "catalog/actions.toml"

[similarity]
threshold = 0.7
w_steps = 0.6
w_preconditions = 0.2
w_criteria = 0.2
# true면 수치 파라미터를 normal / boundary / invalid 클래스로 시그니처에 포함
value_classes = false

[policy]
# INCONCLUSIVE 결과를 다시 승인할 수 있는 최대 재시도 횟수
max_retries = 2
# 세션 내 거절 횟수에 따른 안내 (§5 행동 루프)
hint_after_rejections = 3
saturate_after_rejections = 5
similar_top_k = 3
hint_limit = 5

# 테스트 대상 설치 파일 허용 목록. Worker는 여기 등록된 파일만, 해시가 맞을 때만 VM에 설치한다.
# Claude는 경로·인자를 정할 수 없고, 필요하면 키 이름만 고른다.
[installers."savex-1.16.0.19"]
path = "test_target_file/savex_가연_테스트중_20ep_v1.16.0.19.exe"
sha256 = "7fc06dc68ad84366d731e194cce0053421df6030bced47167663e41b15ccf3df"
args = []                     # 자동설치 버전이라 추가 인자 없음
timeout_s = 900
success_codes = [0, 3010]     # 3010: 성공, 재부팅 필요

# 골든 이미지 (scripts/build_base.ps1이 관리자 콘솔에서 한 번 만든다)
[image]
iso_dir = "images"                       # Windows 11 Enterprise 평가판 ISO (한국어)
edition = "Enterprise"                   # install.wim 에디션 이름에 포함된 단어로 고른다
base_vhdx = "data/vms/base/base.vhdx"    # 읽기 전용 원본
vm_dir = "data/vms"                      # 테스트 VM · 차등 디스크 위치
credential = "data/guest-cred.xml"       # VM 로컬 관리자 자격 증명 (DPAPI 암호화, 빌드한 사용자만 해독 가능)
switch = "Default Switch"
memory_mb = 4096
cpu = 2

# 테스트 대상 서버. VM에서 이 주소로 접속돼야 한다
[target]
server = "192.168.0.112:10443"

# VM 자리별 고정 MachineGuid. SAVEX uid = SHA256(MachineGuid) 이므로
# 자리마다 다른 PC로 보이고, 같은 자리는 VM을 다시 만들어도 같은 PC로 보인다 (라이선스는 자리 수만큼만 사용)
[slots."run-01"]
machine_guid = "b07be812-b860-4fb0-9004-3cb4db8b1c78"

[slots."run-02"]
machine_guid = "449f80da-8c1a-440c-9997-72073a95939c"

[slots."run-03"]
machine_guid = "03a45936-1611-4a30-9f5b-61141567df92"
