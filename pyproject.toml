[project]
name = "wtest"
version = "0.1.0"
description = "Windows 에이전트 병렬 자동 테스트 (Hyper-V + Claude + MCP)"
readme = "README.md"
authors = [
    { name = "r7", email = "27266573+ruchiayeon@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
]

[project.scripts]
wtest = "wtest.cli:main"

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
